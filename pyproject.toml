[project]
name = "sjrwq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1",
    "pyogrio>=0.13",
    "shapely>=2.1",
    "pyproj>=3.7",
    "pandas>=3.0",
    "pyarrow>=25",
    "numpy>=2",
    "matplotlib>=3.11",
    "requests",
    "pyyaml",
    "rapidfuzz",
    "pillow",
    "tabulate",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["PERF102"]
